<html lang-"en">
<head>
    <!-- Meta -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">

    <!-- <link href="static/css/bootstrap-3.3.7-dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.3/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>

    {% raw %}
    <div ng-app="ClusterLinking">

        <!-- Main Template-->
        <script type="text/ng-template" id="home.html">
					<div>Link Clusters</div>
          <div class="row">
            <div class="col-md-11">
              <div ng-repeat="timeBlock in timeBlocks" class="row">
                <div class="col col-md-12">
                  {{  timeBlock.t_start }}
                </div>
                <div class="col col-md-2">
                  <img class="square" ng-src="{{ timeBlock.scatter }}"></img>
                </div>
                <div class="col col-md-10">
                  <div class="row">
                    <img ng-repeat="cluster in timeBlock.clusters" ng-class="{active: !!isActive($parent.$index, cluster.label), inactive: !!isSelected($parent.$index, cluster.label)}" class="card-box" ng-src="{{ cluster.waveforms }}" ng-click="toggle($parent.$index, cluster.label)">{{cluster}}</img>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-md-1">
              <button ng-click="submit()">Save All Clusters</button>
              <button style="padding: 10px; margin: 10px;" ng-click="save_new_cluster()">Link Cluster</button>

              <div ng-repeat="unitarr in TOSUBMIT track by $index">
                <div ng-repeat="dataarr in unitarr" ng-show="dataarr.length !== 0">
                  <div ng-repeat="clusterId in dataarr track by $index">
                    <img class="small" ng-src="{{ timeBlocks[$parent.$index].clusters[timeBlocks[$parent.$index].labels.indexOf(clusterId)].waveforms }}"></img>  <!-- how to get hte idnex of thig thing -->
                    <p> {{$meow }} {{ $parent.$index }} {{$index }} </p>
                    <p>{{ timeBlocks[$parent.$index].t_start }} {{  timeBlocks[$parent.$index].clusters[timeBlocks[$parent.$index].labels.indexOf(clusterId)].waveforms }}</p>
                  </div>
                </div>
                <button ng-click="ungroup_cluster($parent.$parent.$index)">clear</button>
              </div>
            </div>
          </div>
        </script>

        <ng-view></ng-view>
    {% endraw %}
    </div>

    <script
      src="https://code.jquery.com/jquery-3.2.1.js"
      integrity="sha256-DZAnKJ/6XZ9si04Hgrsxu/8s717jcIzLy3oi35EouyE="
      crossorigin="anonymous"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.6.1/angular.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.6.1/angular-route.js"></script>
    <script type="text/javascript" src="static/js/app.js"></script>

</body>

</html>
